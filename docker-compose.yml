version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: mana_angadi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mana_admin
      POSTGRES_PASSWORD: mana_secure_password
      POSTGRES_DB: mana_angadi_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Node.js Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mana_angadi_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      JWT_SECRET: mana_angadi_super_secret_jwt_key_2026
      DATABASE_URL: postgresql://mana_admin:mana_secure_password@postgres:5432/mana_angadi_db
    depends_on:
      - postgres

  # 3. React Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mana_angadi_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
